<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTCOM NC — St. Lawrence County</title>
<meta name="description" content="Scanner, events, campus, business, and news across St. Lawrence County and the North Country.">
<style>
  :root{
    --bg:#0a0d12; --bg2:#0c1017; --panel:#10151f; --panel2:#0d1219;
    --line:#212b3c; --line2:#171e2b;
    --text:#e9edf4; --dim:#9aa8bc; --faint:#7d8ea6;
    --scanner:#e0655f; --event:#d9a441; --campus:#6f9fd8; --business:#a58fd6; --news:#5fae9d;
    --accent:#d9a441;
    --railw:252px; --ctxw:316px; --hdr:65px;
    --ease:cubic-bezier(.22,.61,.26,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;color:var(--text);
    background:linear-gradient(180deg,var(--bg2),var(--bg) 260px) fixed,var(--bg);
    font:15.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:rgba(111,159,216,.35)}
  a{color:var(--campus);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--campus);outline-offset:2px;border-radius:3px}
  .skip{position:absolute;left:-9999px;top:0;background:var(--panel);color:var(--text);padding:8px 14px;z-index:60;border:1px solid var(--line)}
  .skip:focus{left:10px;top:10px}
  .railnav{display:flex;flex-direction:column;gap:7px}
  .railnav a{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--dim)}
  .railnav a:hover{color:var(--text);text-decoration:none;border-color:var(--faint)}
  .railnav a[aria-current="page"]{color:var(--text);background:var(--panel);border-color:var(--faint)}

  /* ---------- Masthead: full-bleed bar ---------- */
  header.site{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);
    background:rgba(10,13,18,.9);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
  .mast{display:flex;align-items:center;gap:16px;padding:13px 30px 12px}
  .mark{flex:none;width:11px;height:11px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .brand{font-size:19px;font-weight:700;letter-spacing:.16em;line-height:1.15;white-space:nowrap}
  .brand small{display:block;font-size:10.5px;font-weight:500;letter-spacing:.14em;color:var(--dim);margin-top:2px}
  .mast .right{text-align:right;color:var(--dim);font-size:12.5px;line-height:1.5;white-space:nowrap}
  .mast .right b{color:var(--text);font-weight:600;font-size:13.5px}
  .pnav{display:flex;gap:8px;align-items:center;flex:none;margin-left:auto}
  .pnav-btn{appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:13px;color:var(--dim);cursor:pointer;text-decoration:none;line-height:1.2;
    transition:color .15s ease,border-color .15s ease,background .15s ease}
  .pnav-btn:hover{color:var(--text);border-color:var(--faint);text-decoration:none}
  .pnav-btn:focus-visible{outline:2px solid var(--campus);outline-offset:2px}
  .livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--news);margin-right:6px;vertical-align:1px;
    animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* Narrow-width filter bar (lives in the header below 1024px) */
  .bar{display:none;border-top:1px solid var(--line2);padding:9px 16px;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}

  /* ---------- Chips ---------- */
  .chip{appearance:none;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;
    transition:color .15s ease,border-color .15s ease,background .15s ease;white-space:nowrap;flex:none}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .chip[data-cat="scanner"] .dot{background:var(--scanner)} .chip[data-cat="event"] .dot{background:var(--event)}
  .chip[data-cat="campus"] .dot{background:var(--campus)} .chip[data-cat="business"] .dot{background:var(--business)}
  .chip[data-cat="news"] .dot{background:var(--news)}
  .chip:hover{color:var(--text);border-color:var(--faint)}
  .chip[aria-pressed="true"]{color:var(--text);border-color:var(--faint);background:var(--panel)}
  .chip .n{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}

  /* ---------- Full-bleed layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr)}
  @media (min-width:1024px){
    .layout{grid-template-columns:var(--railw) minmax(0,1fr)}
  }
  @media (min-width:1500px){
    .layout{grid-template-columns:var(--railw) minmax(0,1fr) var(--ctxw)}
  }

  /* Left rail */
  aside.rail{display:none}
  @media (min-width:1024px){
    aside.rail{display:block;position:sticky;top:var(--hdr);align-self:start;height:calc(100vh - var(--hdr));
      overflow-y:auto;padding:26px 22px 40px 30px;border-right:1px solid var(--line2)}
  }
  .rail h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 12px}
  .rail .vchips{display:flex;flex-direction:column;gap:7px;align-items:stretch}
  .rail .vchips .chip{justify-content:flex-start;padding:7px 13px}
  .rail .vchips .chip .n{margin-left:auto}
  .rail .countline{color:var(--faint);font-size:12.5px;margin-top:12px}
  .rail section{margin-bottom:30px}
  .rail section:last-child{margin-bottom:0}
  .rail p{color:var(--dim);font-size:13.5px;line-height:1.65;margin:0}

  /* Right context rail */
  aside.ctx{display:none}
  @media (min-width:1500px){
    aside.ctx{display:block;position:sticky;top:var(--hdr);align-self:start;height:calc(100vh - var(--hdr));
      overflow-y:auto;padding:26px 30px 40px 24px;border-left:1px solid var(--line2)}
  }
  .ctx h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 6px}
  .ctx section{margin-bottom:28px}
  .mini{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);
    padding:10px 2px;cursor:pointer;color:inherit;transition:background .15s ease}
  .mini:last-of-type{border-bottom:0}
  .mini:hover{background:rgba(255,255,255,.02)}
  .mini .mt{display:flex;gap:7px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .mini .mt .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .mini .mt .pulse-dot{animation:pulse 2.6s ease-in-out infinite}
  .mini .mh{display:block;font-size:13.5px;font-weight:550;line-height:1.45;color:var(--text)}
  .mini .mp{display:block;font-size:12px;color:var(--faint);margin-top:1px}
  .ctx .empty{color:var(--faint);font-size:13px;padding:8px 0}

  /* ---------- Stream ---------- */
  main.stream{padding:10px 46px 90px;min-width:0}
  .stream-inner{max-width:940px;margin:0 auto}
  @media (max-width:1023.98px){
    .bar{display:flex}
    main.stream{padding:6px 20px 70px}
    .stream-inner{max-width:760px;margin:0 auto}
  }
  @media (max-width:560px){ main.stream{padding:4px 16px 60px} .mast{padding:12px 16px 11px} }
  @media (max-width:640px){
    .mast{flex-wrap:wrap;row-gap:3px}
    .mast .right{order:3;width:100%;margin-left:0;text-align:left}
    .pnav{margin-left:auto}
    .brand small{letter-spacing:.09em}
  }
  #stream{transition:opacity .18s ease,transform .18s ease}
  #stream.swap{opacity:0;transform:translateY(4px)}

  .group{margin-top:34px}
  .group:first-child{margin-top:22px}
  .group h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;
    display:flex;align-items:center;gap:14px;margin:0 0 4px}
  .group h2::after{content:"";flex:1;height:1px;background:var(--line2)}

  .item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:18px;padding:17px 12px 16px;
    border-bottom:1px solid var(--line2);border-radius:8px;transition:background .15s ease}
  .item:hover{background:rgba(255,255,255,.016)}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .item.enter{animation:rise .38s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
  @keyframes flash{0%{background:rgba(111,159,216,.13)}100%{background:transparent}}
  .item.flash{animation:flash 1.3s ease}
  .rail-t{text-align:right;padding-top:3px}
  .rail-t .t{font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
  .rail-t .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-top:8px}
  .cat-scanner{background:var(--scanner)} .cat-event{background:var(--event)} .cat-campus{background:var(--campus)}
  .cat-business{background:var(--business)} .cat-news{background:var(--news)}
  .body{min-width:0}
  .kicker{display:flex;gap:9px;align-items:center;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .kicker .catname{font-weight:700}
  .tx-scanner{color:var(--scanner)} .tx-event{color:var(--event)} .tx-campus{color:var(--campus)}
  .tx-business{color:var(--business)} .tx-news{color:var(--news)}
  .pill{border:1px solid var(--event);color:var(--event);border-radius:999px;padding:0 7px;font-size:10px;letter-spacing:.1em;line-height:1.7}
  h3.head{font-size:17.5px;line-height:1.35;margin:0 0 4px;font-weight:650;letter-spacing:-.005em}
  h3.head button{all:unset;cursor:pointer;display:flex;width:100%;gap:10px;align-items:flex-start}
  h3.head button:focus-visible{outline:2px solid var(--campus);outline-offset:3px;border-radius:3px}
  h3.head .chev{flex:none;margin-top:7px;color:var(--faint);font-size:11px;transition:transform .25s var(--ease)}
  .item.open .chev{transform:rotate(180deg)}
  .what{color:var(--dim);margin:0;font-size:14.5px}
  .meta{color:var(--faint);font-size:12.5px;margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .meta .sep{opacity:.5}

  /* Expanded layer */
  .detail{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s var(--ease),opacity .25s ease}
  .detail.open{grid-template-rows:1fr;opacity:1}
  .detail > div{overflow:hidden;min-height:0}
  .story{margin:13px 0 0;font-size:14.5px;color:#c3cedd;max-width:68ch}
  .foot{margin-top:10px;font-size:12.5px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
  .enrich{margin-top:9px;font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:11px}
  .upd{margin-top:9px;font-size:13.5px;background:rgba(217,164,65,.07);border:1px solid rgba(217,164,65,.22);
    border-radius:8px;padding:8px 12px}
  .upd b{color:var(--event);font-weight:650}
  @media (max-width:560px){.item{grid-template-columns:60px minmax(0,1fr);gap:11px;padding:15px 4px 14px}}

  .quiet{padding:60px 10px;text-align:center;color:var(--faint)}

  /* Further out — distant minor items, folded away by the gravity rule */
  .fold{margin-top:34px}
  .foldbtn{appearance:none;background:none;border:0;cursor:pointer;width:100%;padding:2px 0;
    display:flex;align-items:center;gap:14px;color:var(--faint);
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .foldbtn::after{content:"";flex:1;height:1px;background:var(--line2)}
  .foldbtn .chev{display:inline-block;transition:transform .25s var(--ease);font-size:11px;letter-spacing:0}
  .foldbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .foldbtn:hover{color:var(--dim)}
  .foldbody{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s var(--ease),opacity .25s ease}
  .foldbody.open{grid-template-rows:1fr;opacity:1}
  .foldbody > div{overflow:hidden;min-height:0}

  footer.site{border-top:1px solid var(--line2);padding:20px 30px 26px;color:var(--faint);font-size:12.5px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
  footer.site b{color:var(--dim);font-weight:600;letter-spacing:.1em}
  footer.site .sp{margin-left:auto}

  @media print{
    body{background:#fff;color:#111}
    header.site,aside.rail,aside.ctx,.bar,footer.site,.skip{display:none !important}
    main.stream{padding:0}
    .stream-inner{max-width:none}
    .item{break-inside:avoid;border-bottom:1px solid #ccc}
    .detail{display:block;opacity:1}
    .what,.story,.meta,.foot,.kicker,.rail-t .t{color:#333}
    h3.head{color:#000}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
.loc-chip{display:inline-flex;align-items:center;gap:5px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px;cursor:pointer;vertical-align:baseline}
.loc-chip:hover{border-color:var(--ink)}
.loc-chip svg{flex:none}
.loc-chip .dchip{color:var(--faint)}
.src-ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:5px;border:1px solid var(--line);border-radius:50%;color:var(--ink);vertical-align:-5px}
.src-ic:hover{border-color:var(--ink);background:var(--paper)}
.mappop{position:fixed;inset:0;z-index:60;display:none}
.mappop.on{display:block}
.mappop .mp-back{position:absolute;inset:0;background:rgba(20,19,15,.45)}
.mappop .mp-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(20,19,15,.35);overflow:hidden}
.mappop .mp-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mappop .mp-name{font:600 14px/1.3 var(--sans)}
.mappop .mp-x{margin-left:auto;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;font-size:14px;line-height:1}
.mappop iframe{display:block;width:100%;height:300px;border:0;background:var(--bg)}
</style>
</head>

function groupLabel(key, gi){
  if(key === "coming") return "Coming up";
  if(key === "earlier") return "Earlier";
  const mx = gi.map(it => it.when && it.when.sort).filter(Boolean).sort().pop();
  if(!mx) return "Today";
  const d = new Date(mx);
  return isNaN(d) ? "Today" : "Today — " + d.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"});
}

/* ---------- Center of gravity: Potsdam is the center ----------
   Collection gathers everything; gravity governs ordering and prominence.
   Rings: potsdam (the center) → near → county → beyond. A functional boost
   (nearest-of-its-kind, places Potsdam people actually go) lifts a beyond
   item to county weight. Beyond items with no boost and nothing live about
   them fold into "Further out" instead of competing with Potsdam items.
   In Today's live window, developing items resist gravity — something still
   unfolding stays up. In older groups plain gravity + recency rules. */
const RINGW = {potsdam:0, near:1, county:2, beyond:3};
const effRing = it => (it.ring === "beyond" && it.boost) ? "county" : (it.ring || "county");
const isFar = it => effRing(it) === "beyond" && it.status !== "developing";
/* Freshness + watch ranking (JD 2026-11-04 overnight notes).
   A watch-tier item pins above everything while it is fresh
   (2 hours from its last update) — the moment one of those
   sources pings, it is front and center. A developing item pins
   above its gravity band only while it is still being verified:
   until its verify_by stamp, or a default window (scanner 6h,
   everything else 24h) from its last update. Past that it falls
   back to its band like any other item — prominence is earned
   by currency, never granted permanently. */
function pinRank(it){
  const now = Date.now();
  const upd = it.upd_sort ? new Date(it.upd_sort).getTime()
    : (it.when && it.when.sort ? new Date(it.when.sort).getTime() : 0);
  const ageH = upd ? (now - upd) / 36e5 : 999;
  if(it.watch && ageH <= 2) return -2;
  if(it.status === "developing"){
    if(it.verify_by) return now <= new Date(it.verify_by).getTime() ? -1 : RINGW[effRing(it)];
    if(ageH <= (it.category === "scanner" ? 6 : 24)) return -1;
  }
  return RINGW[effRing(it)];
}
function gravitySort(a, b, livePin){
  const da = livePin ? pinRank(a) : RINGW[effRing(a)];
  const db = livePin ? pinRank(b) : RINGW[effRing(b)];
  if(da !== db) return da - db;
  return String(b.when.sort).localeCompare(String(a.when.sort));
}
const distCue = it => it.dist ? ` · ${it.dist} mi` : "";


/* ---------- Freshness gate (JD 2026-11-04: only current
   information, strictly) ----------
   Applied to whatever data arrives — live file or fallback — so
   a stale data file can never present stale items as current.
   Windows: scanner 48h, news 7 days, campus/business 30 days,
   events until start + 3h. A non-event item stamped in the
   future is held outright (time integrity): a post claiming a
   time that has not happened yet is a bad stamp, not news. */
const WINH = {scanner:48, news:168, campus:720, business:720};
function freshGate(items){
  const now = Date.now();
  return (items || []).filter(it => {
    const sort = it.when && it.when.sort ? new Date(it.when.sort).getTime() : null;
    if(sort != null && sort > now + 36e5 && it.group !== "coming") return false;
    if(it.category === "event"){
      return !(sort != null && now > sort + 3 * 36e5);
    }
    const w = WINH[it.category] || 168;
    const upd = it.upd_sort ? new Date(it.upd_sort).getTime() : null;
    const ref = Math.max(sort || 0, upd || 0);
    if(!ref) return true;
    return (now - ref) / 36e5 <= w;
  });
}

function render(){
  const main = document.getElementById("stream");
  const shown = ITEMS.filter(it => activeCat === "all" || it.category === activeCat);
  const label = shown.length + (shown.length === 1 ? " item in the stream" : " items in the stream");
  const c1 = document.getElementById("count"); if(c1) c1.textContent = label;
  const c2 = document.getElementById("count-m"); if(c2) c2.textContent = shown.length + (shown.length === 1 ? " item" : " items");
  if(!shown.length){
    main.innerHTML = `<div class="quiet">Nothing in this slice of the stream right now.</div>`;
    return;
  }
  let i = 0;
  const far = shown.filter(it => it.group !== "coming" && isFar(it));
  const nearItems = shown.filter(it => !far.includes(it));
  let html = GROUPS.map(([key]) => {
    let gi = nearItems.filter(it => it.group === key);
    if(key === "coming") gi = gi.slice().sort((a,b) => String(a.when.sort).localeCompare(String(b.when.sort)));
    else gi = gi.slice().sort((a,b) => gravitySort(a, b, key === "today"));
    if(!gi.length) return "";
    return `<section class="group"><h2>${esc(groupLabel(key, gi))}</h2>${gi.map(it => itemHTML(it, i++)).join("")}</section>`;
  }).join("");
  if(far.length){
    const fl = far.slice().sort((a,b) => gravitySort(a, b, false));
    html += `<section class="fold"><button class="foldbtn" type="button" data-fold aria-expanded="${foldOpen}">Further out — ${fl.length} ${fl.length === 1 ? "item" : "items"}<span class="chev" aria-hidden="true">▾</span></button>
      <div class="foldbody ${foldOpen ? "open" : ""}"><div>${fl.map(it => itemHTML(it, i++)).join("")}</div></div></section>`;
  }
  main.innerHTML = html;
}

/* Expand/collapse in place — no re-render, so the motion stays smooth */
document.getElementById("stream").addEventListener("click", e => {
  const fb = e.target.closest("[data-fold]");
  if(fb){
    foldOpen = !foldOpen;
    fb.setAttribute("aria-expanded", foldOpen ? "true" : "false");
    fb.parentElement.querySelector(".foldbody").classList.toggle("open", foldOpen);
    return;
  }
  const btn = e.target.closest("[data-toggle]");
  if(!btn) return;
  const art = btn.closest(".item");
  const detail = art.querySelector(".detail");
  const opening = !detail.classList.contains("open");
  openId = opening ? btn.getAttribute("data-toggle") : null;
  detail.classList.toggle("open", opening);
  art.classList.toggle("open", opening);
  btn.setAttribute("aria-expanded", opening ? "true" : "false");
});

/* ---------- Context rail: navigation into the stream, not a second copy ---------- */
function jumpTo(id){
  const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if(!el){
    const it = ITEMS.find(x => x.id === id);
    if(it && it.category !== activeCat){ setFilter("all"); }
    setTimeout(() => jumpTo(id), reduced ? 30 : 220);
    return;
  }
  el.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"center"});
  const btn = el.querySelector("[data-toggle]");
  if(btn && !el.querySelector(".detail").classList.contains("open")) btn.click();
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function miniHTML(it, sub){
  return `<button class="mini" data-jump="${esc(it.id)}">
    <span class="mt"><span class="dot cat-${esc(it.category)}"></span>${esc(sub)}</span>
    <span class="mh">${esc(it.headline)}</span>
    <span class="mp">${esc(it.where.place)} · ${esc(it.where.town)}</span></button>`;
}
function renderCtx(){
  const dev = ITEMS.filter(it => it.status === "developing").slice(0,4);
  const up = ITEMS.filter(it => it.group === "coming")
    .sort((a,b) => String(a.when.sort).localeCompare(String(b.when.sort))).slice(0,5);
  document.getElementById("ctx-dev").innerHTML = dev.length
    ? dev.map(it => miniHTML(it, `${CATLABEL[it.category]} · Updated ${it.updated}`)).join("")
    : `<div class="empty">Nothing developing right now.</div>`;
  document.getElementById("ctx-up").innerHTML = up.length
    ? up.map(it => miniHTML(it, it.when.display)).join("")
    : `<div class="empty">Nothing scheduled in the window.</div>`;
  document.querySelectorAll("[data-jump]").forEach(b =>
    b.addEventListener("click", () => jumpTo(b.getAttribute("data-jump"))));
}

/* ---------- Boot ---------- */
function fmtGenerated(iso, sample){
  if(!iso) return "Stream — sample edition";
  const d = new Date(iso);
  if(isNaN(d)) return "Stream — sample edition";
  const t = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const base = d.toDateString() === new Date().toDateString()
    ? "Stream updated " + t
    : "Stream updated " + d.toLocaleDateString("en-US",{month:"short", day:"numeric"}) + ", " + t;
  return sample ? base + " · sample edition" : base;
}
function boot(data, sample){
  ITEMS = freshGate((data && data.items) || []);
  document.getElementById("updated").textContent = fmtGenerated(data && data.generated, sample);
  paintChips();
  render();
  renderCtx();
}
document.getElementById("today").textContent =
  new Date().toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric", year:"numeric"});

/* Persistent Home / Back (JD 2026-11-04). Home always returns to
   the top of the stream with filters cleared; Back walks the
   browser history, falling back to the stream from a cold start. */
document.getElementById("navBack").addEventListener("click", () => {
  if(history.length > 1) history.back(); else location.href = "index.html";
});
document.getElementById("navHome").addEventListener("click", e => {
  e.preventDefault();
  openId = null; foldOpen = false;
  setFilter("all");
  window.scrollTo({top:0, behavior: reduced ? "auto" : "smooth"});
});

fetch("data/items.json", {cache:"no-store"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => boot(d, false))
  .catch(() => {
    if(FALLBACK && FALLBACK.items && FALLBACK.items.length){ boot(FALLBACK, true); }
    else {
      ITEMS = []; paintChips(); renderCtx();
      document.getElementById("stream").innerHTML =
        `<div class="quiet">The stream is quiet right now.</div>`;
    }
  });
</script>

<div class="mappop" id="mappop" role="dialog" aria-modal="true" aria-label="Map">
  <div class="mp-back" data-mpclose></div>
  <div class="mp-card">
    <div class="mp-head"><span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span><span class="mp-name" id="mpName"></span><button type="button" class="mp-x" data-mpclose aria-label="Close map">×</button></div>
    <iframe id="mpFrame" title="Map" loading="lazy"></iframe>
  </div>
</div>
<script>
(function(){
  const pop = document.getElementById("mappop");
  const frame = document.getElementById("mpFrame");
  const name = document.getElementById("mpName");
  function openMap(lat, lon, label){
    const d = 0.045;
    frame.src = "https://www.openstreetmap.org/export/embed.html?bbox=" + (lon-d) + "," + (lat-d*0.7) + "," + (lon+d) + "," + (lat+d*0.7) + "&layer=mapnik&marker=" + lat + "," + lon;
    name.textContent = label;
    pop.classList.add("on");
  }
  function closeMap(){ pop.classList.remove("on"); frame.removeAttribute("src"); }
  document.addEventListener("click", e => {
    const chip = e.target.closest("[data-loc]");
    if(chip){
      const parts = chip.getAttribute("data-loc").split(",");
      openMap(parseFloat(parts[0]), parseFloat(parts[1]), chip.getAttribute("data-locname") || "");
      return;
    }
    if(e.target.closest("[data-mpclose]")) closeMap();
  });
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeMap(); });
})();
</script>
