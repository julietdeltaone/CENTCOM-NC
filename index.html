<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTCOM NC — North Country, one stream</title>
<style>
  :root{
    --bg:#0a0d12; --bg2:#0d1119; --panel:#10151f; --line:#1f2837; --line2:#171e2b;
    --text:#e9edf4; --dim:#93a1b5; --faint:#62708a;
    --scanner:#e0655f; --event:#d9a441; --campus:#6f9fd8; --business:#a58fd6; --news:#5fae9d;
    --accent:#d9a441;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 240px);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--campus);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px 64px}

  /* Masthead */
  header{border-bottom:1px solid var(--line);background:rgba(10,13,18,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
  .mast{max-width:800px;margin:0 auto;padding:14px 20px 12px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .mark{display:inline-block;width:11px;height:11px;background:var(--accent);border-radius:2px;transform:translateY(-1px) rotate(45deg)}
  .brand{font-size:19px;font-weight:700;letter-spacing:.14em}
  .brand small{display:block;font-size:11px;font-weight:400;letter-spacing:.08em;color:var(--dim);margin-top:1px}
  .mast .right{margin-left:auto;text-align:right;color:var(--dim);font-size:12.5px;line-height:1.5}
  .mast .right b{color:var(--text);font-weight:600}

  /* Filters */
  .filters{max-width:800px;margin:0 auto;padding:12px 20px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{appearance:none;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .chip[data-cat="scanner"] .dot{background:var(--scanner)} .chip[data-cat="event"] .dot{background:var(--event)}
  .chip[data-cat="campus"] .dot{background:var(--campus)} .chip[data-cat="business"] .dot{background:var(--business)}
  .chip[data-cat="news"] .dot{background:var(--news)}
  .chip[aria-pressed="true"]{color:var(--text);border-color:var(--faint);background:var(--panel)}
  .count{margin-left:auto;color:var(--faint);font-size:12.5px}

  /* Stream */
  .group{margin-top:30px}
  .group h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;
    display:flex;align-items:center;gap:12px;margin:0 0 6px}
  .group h2::after{content:"";flex:1;height:1px;background:var(--line2)}
  .item{display:grid;grid-template-columns:74px 1fr;gap:16px;padding:16px 10px 15px;border-bottom:1px solid var(--line2);border-radius:6px}
  .item:hover{background:rgba(255,255,255,.014)}
  .rail{text-align:right;padding-top:2px}
  .rail .t{font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .rail .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-top:7px}
  .cat-scanner{background:var(--scanner)} .cat-event{background:var(--event)} .cat-campus{background:var(--campus)}
  .cat-business{background:var(--business)} .cat-news{background:var(--news)}
  .body{min-width:0}
  .kicker{display:flex;gap:9px;align-items:center;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .kicker .catname{font-weight:700}
  .tx-scanner{color:var(--scanner)} .tx-event{color:var(--event)} .tx-campus{color:var(--campus)}
  .tx-business{color:var(--business)} .tx-news{color:var(--news)}
  .pill{border:1px solid var(--event);color:var(--event);border-radius:999px;padding:0 7px;font-size:10px;letter-spacing:.1em;line-height:1.7}
  h3.head{font-size:17px;line-height:1.35;margin:0 0 4px;font-weight:650}
  h3.head button{all:unset;cursor:pointer;display:block;width:100%}
  h3.head button:focus-visible{outline:2px solid var(--campus);outline-offset:3px;border-radius:3px}
  .what{color:var(--dim);margin:0;font-size:14.5px}
  .meta{color:var(--faint);font-size:12.5px;margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .meta .sep{opacity:.5}

  /* Expanded layer */
  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
  .detail.open{grid-template-rows:1fr}
  .detail > div{overflow:hidden}
  @media (prefers-reduced-motion:reduce){.detail{transition:none}}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 26px;margin:15px 0 4px;padding:14px 16px;
    background:var(--panel);border:1px solid var(--line2);border-radius:10px}
  @media (max-width:560px){.wgrid{grid-template-columns:1fr}.item{grid-template-columns:58px 1fr;gap:11px}}
  .wgrid dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 1px}
  .wgrid dd{margin:0;font-size:14px}
  .wgrid .wide{grid-column:1/-1}
  .foot{margin-top:10px;font-size:12.5px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
  .enrich{margin-top:9px;font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:11px}
  .upd{margin-top:9px;font-size:13.5px;background:rgba(217,164,65,.07);border:1px solid rgba(217,164,65,.22);
    border-radius:8px;padding:8px 12px}
  .upd b{color:var(--event);font-weight:650}
  .quiet{padding:56px 10px;text-align:center;color:var(--faint)}
  footer{max-width:800px;margin:44px auto 0;padding:18px 20px 0;border-top:1px solid var(--line2);color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="mast">
    <div class="brand"><span class="mark"></span>&nbsp; CENTCOM NC
      <small>NORTH COUNTRY CENTRAL &middot; ST. LAWRENCE COUNTY</small>
    </div>
    <div class="right"><b id="today">—</b><br><span id="updated">Stream —</span></div>
  </div>
  <nav class="filters" id="filters" aria-label="Filter the stream">
    <button class="chip" data-cat="all" aria-pressed="true">All</button>
    <button class="chip" data-cat="scanner" aria-pressed="false"><span class="dot"></span>Scanner</button>
    <button class="chip" data-cat="event" aria-pressed="false"><span class="dot"></span>Events</button>
    <button class="chip" data-cat="campus" aria-pressed="false"><span class="dot"></span>Campus</button>
    <button class="chip" data-cat="business" aria-pressed="false"><span class="dot"></span>Business</button>
    <button class="chip" data-cat="news" aria-pressed="false"><span class="dot"></span>News</button>
    <span class="count" id="count"></span>
  </nav>
</header>

<main class="wrap" id="stream" aria-live="polite">
  <div class="quiet" id="loading">Loading the stream…</div>
</main>

<footer>
  CENTCOM NC — one stream for the North Country: scanner, events, campus, business, and news.
  Every item answers what, where, when, who, and why — or it doesn't ship.
</footer>

<script>
"use strict";
const FALLBACK = {"generated":"2026-11-04T17:00:00-05:00","items":[{"category":"scanner","confidence":"reported","enrichment":"Single dispatch post so far. Hospital and fire channels have not posted a follow-up; the item stays 'developing' until one does.","first_seen":"10:31 PM","group":"today","headline":"Natural gas odor reported at Massena Hospital ER entrance","id":"scanner-20261104-massena-gas","rail":"10:22 PM","source":{"name":"SLC Scanner News (Facebook)","url":"https://facebook.com/groups/501798774041567/permalink/2098544701033625/"},"status":"developing","updated":"11:05 PM","updates":[{"at":"11:05 PM","text":"Fire crews remained on scene at the ER entrance; hospital operations continued while the exterior was checked."}],"what":"Massena Fire was called for the smell of natural gas outside the emergency room entrance at Massena Hospital.","when":{"display":"Tonight, 10:22 PM","sort":"2026-11-04T22:22:00-05:00"},"where":{"place":"Massena Hospital, ER entrance","town":"Massena"},"who":"Massena Fire Department","why":"Not yet known. Crews were checking the exterior of the building; no source was confirmed in the initial dispatch."},{"category":"scanner","confidence":"reported","enrichment":"No injuries and no road closure reported, so the item carries no follow-up unless a second post contradicts it.","first_seen":"11:15 PM","group":"today","headline":"Car vs. deer on CR 38, Norfolk","id":"scanner-20261104-norfolk-deer","rail":"11:08 PM","source":{"name":"SLC Scanner News (Facebook)","url":"https://facebook.com/groups/501798774041567/permalink/2098570221031073/"},"status":"closed","updated":"11:15 PM","what":"A vehicle struck a deer at 581 CR 38 in Norfolk. No injuries were reported in the post.","when":{"display":"Tonight, 11:08 PM","sort":"2026-11-04T23:08:00-05:00"},"where":{"place":"581 CR 38","town":"Norfolk"},"who":"Driver on scene; county dispatch","why":"Deer movement peaks after dark in November; CR 38 is a known crossing stretch."},{"category":"scanner","confidence":"single-source","enrichment":"Scanner-group post only at this point. Held at 'single-source' until a blotter or second group confirms the call.","first_seen":"10:57 PM","group":"today","headline":"Threat reported on Tucker Rd, Pierrepont","id":"scanner-20261104-pierrepont-threat","rail":"10:49 PM","source":{"name":"SLC Scanner News (Facebook)","url":"https://facebook.com/groups/501798774041567/permalink/2098559537698808/"},"status":"new","updated":"10:57 PM","what":"A caller reported an individual threatening to burn a house down at 206 Tucker Rd; people were gathered out front when the call came in.","when":{"display":"Tonight, 10:49 PM","sort":"2026-11-04T22:49:00-05:00"},"where":{"place":"206 Tucker Rd","town":"Pierrepont"},"who":"Caller; responding deputies","why":"Not yet known. The dispatch post gives no background on the dispute."},{"category":"news","confidence":"confirmed","enrichment":"Carried by the local news source of record for the county; margin detail will land with the county board of elections canvass.","first_seen":"9:40 PM","group":"today","headline":"NY-21 congressional race called for Constantino","id":"news-20261104-ny21","rail":"Evening","source":{"name":"North Country Now","url":""},"status":"closed","updated":"9:40 PM","what":"North Country Now reported the NY-21 House race called, keeping the seat Republican as statewide results came in on election night.","when":{"display":"Tue, Nov 4, evening","sort":"2026-11-04T20:00:00-05:00"},"where":{"place":"NY-21 district","town":"St. Lawrence County"},"who":"Voters across the 21st district","why":"Election Day. The call closes the county's most-watched race of the cycle."},{"category":"news","confidence":"reported","enrichment":"Single news item; no second source needed at this weight — it changes nothing operational for anyone.","first_seen":"3:20 PM","group":"today","headline":"Benefit concert raises $8,000 for North Country Children's Museum","id":"news-20261104-childrens-museum","rail":"Today","source":{"name":"North Country Now","url":""},"status":"closed","updated":"3:20 PM","what":"A benefit concert raised $8,000 for the North Country Children's Museum in Potsdam.","when":{"display":"Tue, Nov 4","sort":"2026-11-04T15:00:00-05:00"},"where":{"place":"North Country Children's Museum","town":"Potsdam"},"who":"North Country Children's Museum","why":"Fundraising event for the museum's programs; the total was reported by local news the same day."},{"category":"event","confidence":"reported","enrichment":"Calendar listing only; start time shown as listed. Library events are free unless the listing says otherwise.","first_seen":"This morning","group":"today","headline":"Crane Jazz Ensembles at Potsdam Library","id":"event-20261104-crane-jazz","rail":"Tonight","source":{"name":"North Country Now community calendar","url":""},"status":"new","updated":"This morning","what":"Crane School of Music jazz ensembles perform at the Potsdam Public Library this evening.","when":{"display":"Wed, Nov 4, evening","sort":"2026-11-04T19:00:00-05:00"},"where":{"place":"Potsdam Public Library","town":"Potsdam"},"who":"Crane School of Music, SUNY Potsdam","why":"A standing community performance series pairing Crane ensembles with the public library."},{"category":"event","confidence":"confirmed","enrichment":"Puck drop 7:00 PM. Expect heavier traffic on NY-11 and around the Clarkson campus from about 6 PM.","first_seen":"This week","group":"coming","headline":"Clarkson men's hockey vs. Union at Cheel","id":"event-20261106-clarkson-hockey","rail":"FRI 11/6","source":{"name":"Clarkson athletics schedule","url":""},"status":"new","updated":"This week","what":"Clarkson hosts Union in an ECAC matchup at Cheel Arena on Friday night.","when":{"display":"Fri, Nov 6, 7:00 PM","sort":"2026-11-06T19:00:00-05:00"},"where":{"place":"Cheel Arena, Clarkson University","town":"Potsdam"},"who":"Clarkson Golden Knights vs. Union","why":"Conference home game; Friday-night home games are the biggest regular draw on the local calendar."},{"category":"event","confidence":"reported","enrichment":"Calendar listing; venue detail is in the source listing.","first_seen":"This week","group":"coming","headline":"GriefShare session in Lisbon","id":"event-20261105-griefshare","rail":"THU 11/5","source":{"name":"North Country Now community calendar","url":""},"status":"new","updated":"This week","what":"A GriefShare support session meets in Lisbon on Thursday.","when":{"display":"Thu, Nov 5","sort":"2026-11-05T18:00:00-05:00"},"where":{"place":"Lisbon","town":"Lisbon"},"who":"GriefShare (community group)","why":"A recurring grief-support series that rotates through local churches."},{"category":"campus","confidence":"confirmed","enrichment":"Tier 1 signal under Campus Intel's filter (VP-level leadership). The follow-up watch is a named successor or interim announcement.","first_seen":"Mon, Nov 2","group":"earlier","headline":"Clarkson's VP for Information Technology & Libraries seat is vacant","id":"campus-20261102-clarkson-vp","rail":"MON 11/2","source":{"name":"Campus Intel sweep — Clarkson","url":""},"status":"developing","updated":"Mon, Nov 2","what":"Clarkson's Vice President for Information Technology & Libraries seat is vacant following Joshua Fiske's removal. No successor or interim has been named.","when":{"display":"Surfaced Mon, Nov 2","sort":"2026-11-02T10:00:00-05:00"},"where":{"place":"Clarkson University","town":"Potsdam"},"who":"Clarkson University leadership","why":"A vice-presidential departure touches every system on campus — IT, library, and the services staff use daily. The open seat is the story until an interim is named."},{"category":"campus","confidence":"reported","enrichment":"Tier 2 notable (construction milestone) under Campus Intel's filter.","first_seen":"Mon, Nov 2","group":"earlier","headline":"Maxcy Hall renovations nearing completion at SUNY Potsdam","id":"campus-20261102-maxcy","rail":"MON 11/2","source":{"name":"Campus Intel sweep — SUNY Potsdam","url":""},"status":"closed","updated":"Mon, Nov 2","what":"Renovations at Maxcy Hall, SUNY Potsdam's athletics and recreation hub, are nearing completion.","when":{"display":"Reported Mon, Nov 2","sort":"2026-11-02T09:00:00-05:00"},"where":{"place":"Maxcy Hall, SUNY Potsdam","town":"Potsdam"},"who":"SUNY Potsdam","why":"Maxcy is the campus's main gym and pool complex; its reopening restores the facility local pickup leagues and the public also use."},{"category":"campus","confidence":"reported","enrichment":"Tier 2 notable under Campus Intel's filter; briefed to JD on Oct 29.","first_seen":"Oct 29","group":"earlier","headline":"WISER Botanical Garden opens at SUNY Potsdam","id":"campus-20261029-wiser","rail":"OCT 29","source":{"name":"Campus Intel sweep — SUNY Potsdam","url":""},"status":"closed","updated":"Oct 29","what":"The WISER Botanical Garden has opened at SUNY Potsdam, a new teaching and public garden space on campus.","when":{"display":"Opened Oct 29","sort":"2026-10-29T10:00:00-04:00"},"where":{"place":"SUNY Potsdam","town":"Potsdam"},"who":"SUNY Potsdam","why":"A new public-facing campus space — part teaching garden, part community amenity."},{"category":"news","confidence":"reported","enrichment":"The why comes from the news story; the scanner and chatter feeds will carry any hearing notices or site work as follow-ups on this same item.","first_seen":"Oct 27","group":"earlier","headline":"Solar array proposed for 599 Bagdad Road, Potsdam","id":"news-20261027-solar-bagdad","rail":"OCT 27","source":{"name":"North Country Now","url":"https://northcountrynow.com/stories/solar-array-eyed-for-property-on-bagdad-road-in-potsdam,397562"},"status":"developing","updated":"Oct 27","what":"A solar array project is proposed for 599 Bagdad Road in Potsdam. The Village of Potsdam Board of Trustees has discussed proposed PILOT agreements with the developers of the $42–51 million project.","when":{"display":"Reported Oct 27","sort":"2026-10-27T16:01:00-04:00"},"where":{"place":"599 Bagdad Road","town":"Potsdam"},"who":"Village of Potsdam Board of Trustees; project developers","why":"A project of this size on Bagdad Road means construction traffic, a tax-agreement decision by the village, and a visible land-use change on a residential road."},{"category":"business","confidence":"confirmed","enrichment":"Deliberately the lightest touch from the business layer — the granular tracking stays in Business Pulse.","first_seen":"Mon, Nov 2","group":"earlier","headline":"Taxi Zero reaches 50 Google reviews","id":"business-20261102-taxi-zero","rail":"MON 11/2","source":{"name":"Taxi Zero weekly sweep","url":""},"status":"closed","updated":"Mon, Nov 2","what":"Taxi Zero's Google review count moved from 48 to 50 in the weekly sweep, holding a 4.5-star rating.","when":{"display":"Week of Nov 2","sort":"2026-11-02T08:00:00-05:00"},"where":{"place":"Taxi Zero","town":"Potsdam"},"who":"Taxi Zero (Potsdam)","why":"The kind of small, steady signal the Overview keeps from the business feeds: reputation compounding, no action needed."}]};
const CATLABEL = {scanner:"Scanner", event:"Event", campus:"Campus", business:"Business", news:"News"};
const GROUPS = [
  ["today",  "Today — Wednesday, November 4"],
  ["coming", "Coming up"],
  ["earlier","Earlier this week"]
];
let ITEMS = [], activeCat = "all", openId = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtGenerated(iso){
  if(!iso) return "Stream — sample edition";
  const d = new Date(iso);
  if(isNaN(d)) return "Stream — sample edition";
  return "Stream updated " + d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}

function itemHTML(it){
  const dev = it.status === "developing";
  const closed = it.status === "closed";
  const updates = (it.updates||[]).map(u =>
    `<div class="upd"><b>Update · ${esc(u.at)}</b> — ${esc(u.text)}</div>`).join("");
  const src = it.source && it.source.url
    ? `<a href="${esc(it.source.url)}" target="_blank" rel="noopener">${esc(it.source.name)}</a>`
    : esc(it.source ? it.source.name : "");
  return `<article class="item" data-cat="${esc(it.category)}" data-id="${esc(it.id)}">
    <div class="rail"><div class="t">${esc(it.rail)}</div><span class="cdot cat-${esc(it.category)}"></span></div>
    <div class="body">
      <div class="kicker"><span class="catname tx-${esc(it.category)}">${esc(CATLABEL[it.category]||it.category)}</span>
        ${dev ? '<span class="pill">Developing</span>' : ""}${closed ? '<span>Closed</span>' : ""}</div>
      <h3 class="head"><button type="button" aria-expanded="${openId===it.id}" data-toggle="${esc(it.id)}">${esc(it.headline)}</button></h3>
      <p class="what">${esc(it.what)}</p>
      <div class="meta"><span>${esc(it.where.place)} · ${esc(it.where.town)}</span><span class="sep">—</span><span>${esc(it.who)}</span></div>
      <div class="detail ${openId===it.id ? "open" : ""}"><div>
        <dl class="wgrid">
          <div><dt>What</dt><dd>${esc(it.what)}</dd></div>
          <div><dt>Where</dt><dd>${esc(it.where.place)}, ${esc(it.where.town)}</dd></div>
          <div><dt>When</dt><dd>${esc(it.when.display)}</dd></div>
          <div><dt>Who</dt><dd>${esc(it.who)}</dd></div>
          <div class="wide"><dt>Why</dt><dd>${esc(it.why)}</dd></div>
        </dl>
        ${updates}
        ${it.enrichment ? `<p class="enrich">${esc(it.enrichment)}</p>` : ""}
        <div class="foot"><span>Source: ${src}</span><span class="sep">·</span>
          <span>First seen ${esc(it.first_seen)}</span><span class="sep">·</span>
          <span>Updated ${esc(it.updated)}</span><span class="sep">·</span>
          <span>${esc(it.confidence)}</span></div>
      </div></div>
    </div>
  </article>`;
}

function render(){
  const main = document.getElementById("stream");
  const shown = ITEMS.filter(it => activeCat === "all" || it.category === activeCat);
  document.getElementById("count").textContent =
    shown.length + (shown.length === 1 ? " item" : " items");
  if(!shown.length){
    main.innerHTML = `<div class="quiet">Nothing in this slice of the stream right now.</div>`;
    return;
  }
  main.innerHTML = GROUPS.map(([key,label]) => {
    const gi = shown.filter(it => it.group === key);
    if(!gi.length) return "";
    return `<section class="group"><h2>${esc(label)}</h2>${gi.map(itemHTML).join("")}</section>`;
  }).join("");
  main.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-toggle");
      openId = (openId === id) ? null : id;
      render();
    });
  });
}

function boot(data){
  ITEMS = (data && data.items) || [];
  document.getElementById("updated").textContent = fmtGenerated(data && data.generated);
  render();
}

document.getElementById("today").textContent =
  new Date().toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric", year:"numeric"});

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("[data-cat]");
  if(!btn) return;
  activeCat = btn.getAttribute("data-cat");
  document.querySelectorAll("#filters .chip").forEach(c =>
    c.setAttribute("aria-pressed", c.getAttribute("data-cat") === activeCat ? "true" : "false"));
  render();
});

fetch("data/items.json", {cache:"no-store"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(boot)
  .catch(() => {
    if(FALLBACK){ boot(FALLBACK); }
    else {
      document.getElementById("stream").innerHTML =
        `<div class="quiet">The stream is quiet right now — the data file hasn't landed yet.<br>Items appear here as the feeds report in.</div>`;
      document.getElementById("count").textContent = "0 items";
    }
  });
</script>
</body>
</html>
